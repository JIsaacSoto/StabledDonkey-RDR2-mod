; StabledDonkey - settings (optional) / configuracion (opcional)
;
; EN: Copy this file next to StabledDonkey.asi. If it is missing, these same
;     default values are used. 1 = on, 0 = off. Restart the game after
;     changing anything.
; ES: Copia este archivo junto a StabledDonkey.asi. Si falta, se usan estos
;     mismos valores por defecto. 1 = activado, 0 = desactivado. Reinicia el
;     juego tras cambiar algo.
[StabledDonkey]

; EN: Donkey treated as a horse: model data in memory and the game script
;     checks (bonding, care, stats, stable).
; ES: Burro tratado como caballo: datos del modelo en memoria y chequeos de
;     los scripts del juego (vinculo, cuidados, estadisticas, establo).
PatchDonkey=1

; EN: Mule and painted mule: bonding, care and stats.
; ES: Mula y mula pintada: vinculo, cuidados y estadisticas.
PatchMules=1

; EN: Stable for the mule and the painted mule: they can be stored, set as
;     the main horse and are kept when the save loads.
; ES: Establo para la mula y la mula pintada: se guardan, pueden ser montura
;     principal y se conservan al cargar la partida.
StableMules=1

; EN: The mod's care prompts: Pat, Brush and Feed in the donkey's right-click
;     menu, and Brush while mounted. Pat is available from the start; Brush
;     and Feed need some bond.
; ES: Botones de cuidado del mod: Acariciar, Cepillar y Alimentar en el menu
;     del clic derecho del burro, y "Cepillar" montado. Acariciar sale desde
;     el principio; cepillar y alimentar piden vinculo.
CarePrompts=1

; EN: The same on-foot prompts for the mule too. Its original prompts are
;     sometimes greyed out; 0 = use the original ones.
; ES: Los mismos botones a pie tambien para la mula. Sus botones originales
;     a veces salen grises; 0 = usar los originales.
CareMuleOnFoot=1

; EN: Controls for those prompts (game control names). By default the same
;     keys as a horse: G pat, B brush, R feed.
; ES: Controles de esos botones (nombres de control del juego). Por defecto,
;     las mismas teclas que el caballo: G acariciar, B cepillar, R alimentar.
CareInputPat=INPUT_INTERACT_LOCKON_ANIMAL
CareInputBrush=INPUT_INTERACT_HORSE_BRUSH
CareInputFeed=INPUT_INTERACT_HORSE_FEED

; EN: Mounted brush (R by default). Only shown when the animal is dirty
;     (0-100), standing still and you are not in a mission.
; ES: Cepillar montado (R por defecto). Solo aparece si el animal esta sucio
;     (0-100), quieto y no estas en una mision.
CareInputMountedBrush=INPUT_CONTEXT_X
CareMountedBrushMinDirt=25

; EN: Maximum distance (metres) to show the on-foot prompts, like a horse.
; ES: Distancia maxima (metros) para mostrar los botones a pie, como el caballo.
CareMaxDistance=2.2

; EN: Game prompts hidden on the donkey (prompt types) so they do not take
;     the keys of the mod's prompts. Empty = hide nothing.
; ES: Botones del juego que se ocultan en el burro (tipos de prompt) para que
;     no ocupen las teclas de los del mod. Vacio = no ocultar nada.
HideVanillaPromptTypes=5,44,47,49,50,52
; EN: On the mule only brush and feed are hidden: hiding all of them made the
;     game drop the locked-on animal a second later.
; ES: En la mula solo se ocultan cepillar y alimentar: ocultar todos hacia que
;     el juego soltara al animal fijado un segundo despues.
HideVanillaPromptTypesMule=49,50

; EN: Priority of the mod's prompts over the game's (0 low, 1 normal,
;     2 high, 3 highest).
; ES: Prioridad de los botones del mod frente a los del juego (0 baja,
;     1 normal, 2 alta, 3 maxima).
CarePromptPriority=2
