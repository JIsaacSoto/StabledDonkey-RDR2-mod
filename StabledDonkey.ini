; StabledDonkey - configuracion (opcional)
; Copia este archivo junto a StabledDonkey.asi. Si falta, se usan estos mismos
; valores por defecto. 1 = activado, 0 = desactivado. Reinicia el juego tras
; cambiar algo.
[StabledDonkey]

; Burro tratado como caballo: datos del modelo en memoria y chequeos de los
; scripts del juego (vinculo, cuidados, estadisticas, establo).
PatchDonkey=1

; Mula y mula pintada: vinculo, cuidados y estadisticas.
PatchMules=1

; Establo para la mula: se guarda, puede ser montura principal y se conserva al
; cargar la partida. Solo cabe un modelo: mule (la mula normal) o painted (la
; mula pintada, que solo aparece en una mision). El otro modelo sigue con el
; fallo del juego original: no lo guardes en el establo.
StableMules=1
StableMuleModel=mule

; Botones de cuidado del mod: Acariciar, Cepillar y Alimentar en el menu del
; clic derecho del burro, y "Cepillar burro" / "Cepillar mula" montado.
; Acariciar sale desde el principio; cepillar y alimentar piden vinculo.
CarePrompts=1

; Los mismos botones a pie tambien para la mula. Sus botones
; originales a veces salen grises; 0 = usar los originales.
CareMuleOnFoot=1

; Controles de esos botones (nombres de control del juego). Por defecto, las
; mismas teclas que el caballo: G acariciar, B cepillar, R alimentar.
CareInputPat=INPUT_INTERACT_LOCKON_ANIMAL
CareInputBrush=INPUT_INTERACT_HORSE_BRUSH
CareInputFeed=INPUT_INTERACT_HORSE_FEED

; Cepillar montado (R por defecto). Solo aparece si el animal esta sucio,
; quieto y no estas en una mision.
CareInputMountedBrush=INPUT_CONTEXT_X
CareMountedBrushMinDirt=25

; Distancia maxima (metros) para mostrar los botones a pie, como el caballo.
CareMaxDistance=2.2

; Botones del juego que se ocultan en el burro (tipos de prompt) para que no
; ocupen las teclas de los del mod. Vacio = no ocultar nada.
HideVanillaPromptTypes=5,44,47,49,50,52
; En la mula solo se ocultan cepillar y alimentar: ocultar todos hacia que
; el juego soltara al animal fijado un segundo despues.
HideVanillaPromptTypesMule=49,50

; Prioridad de los botones del mod frente a los del juego (0 baja, 1 normal,
; 2 alta, 3 maxima).
CarePromptPriority=2
