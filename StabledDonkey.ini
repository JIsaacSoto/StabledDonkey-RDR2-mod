; StabledDonkey - configuracion (opcional)
; Copia este archivo junto a StabledDonkey.asi. Si falta, se usan estos mismos
; valores por defecto. 1 = activado, 0 = desactivado. Reinicia el juego tras
; cambiar algo.
[StabledDonkey]

; Burro tratado como caballo: datos del modelo en memoria y chequeos de los
; scripts del juego (vinculo, cuidados, estadisticas, establo).
PatchDonkey=1

; Mula y mula pintada: vinculo, cuidados y estadisticas. No las guardes en el
; establo: el juego no tiene item para la mula y la guarda rota (fallo del
; juego original).
PatchMules=1

; Botones de cuidado del mod: Acariciar, Cepillar y Alimentar en el menu del
; clic derecho del burro, y "Cepillar burro" / "Cepillar mula" montado.
CarePrompts=1

; Controles de esos botones (nombres de control del juego). Por defecto, las
; mismas teclas que el caballo: G acariciar, B cepillar, R alimentar.
CareInputPat=INPUT_INTERACT_LOCKON_ANIMAL
CareInputBrush=INPUT_INTERACT_HORSE_BRUSH
CareInputFeed=INPUT_INTERACT_HORSE_FEED

; Cepillar montado (R por defecto). Solo aparece si el animal esta sucio,
; quieto y no estas en una mision.
CareInputMountedBrush=INPUT_CONTEXT_X
CareMountedBrushMinDirt=25

; Distancia maxima (metros) para mostrar los botones a pie, como el caballo.
CareMaxDistance=2.2

; Botones grises del juego que se ocultan en el burro (tipos de prompt) para
; que no ocupen las teclas de los del mod. Vacio = no ocultar nada.
HideVanillaPromptTypes=5,44,47,49,50,52
